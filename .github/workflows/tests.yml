name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 test runtime
        run: python -m pip install lupa==2.8
      - name: Python regressions and dictionary validation
        run: python -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Lua 5.1 syntax and regressions
        run: python tools/run_lua_tests.py
      - name: Check release package
        run: python tools/package.py
